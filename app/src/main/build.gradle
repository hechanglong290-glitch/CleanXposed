plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.cleanxposed'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.cleanxposed"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    compileOnly 'de.robv.android.xposed.api:XposedBridge:82'
}
